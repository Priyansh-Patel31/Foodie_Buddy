spring.application.name=admin-backend

# Server Configuration
server.port=${PORT:28080}

# Database Configuration (MongoDB)
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/foodiebuddy}
spring.data.mongodb.auto-index-creation=true

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION_MS:86400000}

# Comma-separated frontend origins (for example, https://your-app.vercel.app)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:3000}

# OpenAPI/Swagger Config
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
